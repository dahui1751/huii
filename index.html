<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>이생규장전 - 이생의 핸드폰</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      user-select: none; 
    }
    body { 
      background-color: #0b0b0e; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      overflow: hidden; 
      padding: 20px 0;
    }
    
    /* 실제 최신 아이폰(19.5:9) 비율로 세로 크기를 넉넉하게 확장 */
    .iphone-frame { 
      width: 410px; 
      height: 880px; 
      background-color: #000; 
      border-radius: 54px; 
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 12px #2c2c2e; 
      position: relative; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column; 
    }
    .notch { 
      position: absolute; 
      top: 0; 
      left: 50%; 
      transform: translateX(-50%); 
      width: 140px; 
      height: 30px; 
      background-color: #000; 
      border-bottom-left-radius: 20px; 
      border-bottom-right-radius: 20px; 
      z-index: 9999; 
    }
    .status-bar { 
      height: 44px; 
      color: #fff; 
      display: flex; 
      justify-content: space-between; 
      align-items: flex-end; 
      padding: 0 28px 8px 28px; 
      font-size: 14px; 
      font-weight: 600; 
      z-index: 9998; 
    }
    .screen { 
      flex: 1; 
      position: relative; 
      background-color: #f2f2f7; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column; 
    }
    .home-indicator { 
      width: 134px; 
      height: 5px; 
      background-color: #fff; 
      border-radius: 3px; 
      position: absolute; 
      bottom: 8px; 
      left: 50%; 
      transform: translateX(-50%); 
      z-index: 9999; 
      pointer-events: none; 
    }
    
    /* iOS 17 홈 화면 스타일 */
    .home-screen { 
      width: 100%; 
      height: 100%; 
      background: linear-gradient(180deg, #1f2232 0%, #0d0f17 100%); 
      padding: 65px 24px 20px 24px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
    }
    .lock-clock { 
      color: rgba(255, 255, 255, 0.9); 
      font-size: 42px; 
      font-weight: 200; 
      margin-top: 10px; 
      letter-spacing: -1px; 
    }
    .lock-date { 
      color: rgba(255, 255, 255, 0.6); 
      font-size: 14px; 
      font-weight: 500; 
      margin-top: -4px; 
    }
    .wallpaper-title { 
      color: rgba(255, 255, 255, 0.4); 
      font-size: 13px; 
      margin-top: 15px; 
      letter-spacing: 3px; 
    }
    
    .app-grid { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 28px 18px; 
      margin-top: 60px; 
      width: 100%; 
    }
    .app-icon { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      cursor: pointer; 
    }
    .app-box { 
      width: 68px; 
      height: 68px; 
      border-radius: 18px; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      font-size: 32px; 
      box-shadow: 0 8px 16px rgba(0,0,0,0.4); 
      transition: transform 0.1s; 
    }
    .app-box:active { transform: scale(0.9); }
    .app-name { color: #fff; font-size: 12px; margin-top: 8px; font-weight: 500; }
    
    .msg-bg { background: linear-gradient(135deg, #34c759, #30d158); }
    .photo-bg { background: linear-gradient(135deg, #ff9500, #ff5e00); }
    .note-bg { background: linear-gradient(135deg, #ffd60a, #ff9500); }
    
    .app-window { 
      position: absolute; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      background-color: #fff; 
      display: none; 
      flex-direction: column; 
      z-index: 10; 
      animation: slideUp 0.25s ease-out forwards; 
    }
    .app-window.active { display: flex; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    
    .app-header { 
      height: 92px; 
      background-color: rgba(246, 246, 246, 0.95); 
      backdrop-filter: blur(10px); 
      border-bottom: 0.5px solid #c6c6c8; 
      display: flex; 
      align-items: flex-end; 
      padding: 0 16px 12px 16px; 
      justify-content: space-between; 
      z-index: 20; 
      flex-shrink: 0; 
    }
    .back-btn { color: #007aff; font-size: 16px; cursor: pointer; display: flex; align-items: center; font-weight: 500; }
    .header-title { font-size: 17px; font-weight: 600; color: #000; }
    
    /* 대화창 레이아웃 및 짤림 완벽 방지 */
    .chat-body { 
      flex: 1; 
      padding: 16px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      background-color: #728294; 
      min-height: 0; 
    }
    .chat-date { align-self: center; background-color: rgba(0, 0, 0, 0.2); color: #fff; font-size: 11px; padding: 4px 12px; border-radius: 10px; margin: 8px 0; }
    .message { display: flex; flex-direction: column; max-width: 80%; }
    .message.received { align-self: flex-start; }
    .message.sent { align-self: flex-end; }
    .sender-name { font-size: 11px; color: #222; margin-bottom: 3px; margin-left: 4px; font-weight: 500; }
    .bubble { padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.4; word-break: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .received .bubble { background-color: #ffffff; color: #000000; border-top-left-radius: 4px; }
